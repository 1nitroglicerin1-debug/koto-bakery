  <style>
    :root {
      --color-bg: #fff7ee;
      --color-bg-card: #ffffff;
      --color-bg-secondary: #faede0;
      --color-bg-tertiary: #f4e1cf;
      
      /* Фирменная тёплая красно-коралловая палитра игры */
      --color-primary: #ff5722;
      --color-primary-hover: #f44336;
      --color-primary-light: #ffeade;
      --color-coral-btn: #ff4757;
      --color-coral-btn-hover: #e84118;
      --color-coral-shadow: rgba(255, 71, 87, 0.35);

      --color-accent-mint: #2ea373;
      --color-accent-mint-hover: #268960;
      --color-accent-gold: #ff9800;
      --color-accent-gold-glow: rgba(255, 152, 0, 0.55);
      --color-accent-emerald: #10b981;
      --color-accent-pink: #f43f5e;
      --color-accent-purple: #8e24aa;
      
      --color-text-main: #34221a;
      --color-text-muted: #836e65;
      --color-border: #ebd3c2;
      --color-border-subtle: #f5e7dd;

      --shadow-sm: 0 2px 8px rgba(52, 34, 26, 0.06);
      --shadow-soft: 0 6px 20px rgba(52, 34, 26, 0.08);
      --shadow-card: 0 10px 28px rgba(52, 34, 26, 0.12);
      --shadow-pop: 0 8px 24px rgba(255, 87, 34, 0.28);

      --radius-xs: 8px;
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-pill: 999px;

      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background-color: #19120e;
      font-family: var(--font-family);
      color: var(--color-text-main);
      touch-action: manipulation;
    }

    .app-container {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      overflow: hidden;
      transition: background 0.6s ease;
    }

    .app-container.theme-bakery-0 {
      background: radial-gradient(130% 80% at 50% 0%, #fffdfa 0%, #fff7ee 60%, #f6e8dc 100%);
    }

    .app-container.theme-bakery-1 {
      background: repeating-linear-gradient(90deg, #f3faf6 0px, #f3faf6 24px, #e8f6ee 24px, #e8f6ee 48px);
    }

    .app-container.theme-bakery-2 {
      background: radial-gradient(130% 85% at 50% 10%, #fff1f2 0%, #ffe4e6 55%, #fed7aa 100%);
    }
    /* Верхняя панель */
    .top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px 2px;
      background: transparent;
      z-index: 20;
    }

    .top-bar-currencies {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .currency-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.74rem;
      font-weight: 800;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    /* Капсула Звёзд: мягкая бронзово-коричневая обводка */
    .currency-badge.stars {
      border: 1.5px solid #8d6e63;
      background: #fbeee6;
      color: #4e342e;
    }

    /* Капсула Рыбок: тёплая золотисто-янтарная обводка */
    .currency-badge.fish {
      border: 1.5px solid #f39c12;
      background: #fef9e7;
      color: #9a3412;
    }

    /* Капсула Клубков: нежно-зелёная мятная обводка */
    .currency-badge.yarn {
      border: 1.5px solid #2ecc71;
      background: #e8f8f0;
      color: #065f46;
    }

    .icon-svg-badge {
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .main-cookies-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .cookies-counter {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .paw-icon {
      font-size: 1.6rem;
      filter: drop-shadow(0 2px 4px rgba(255, 87, 34, 0.35));
    }

    .cookies-value {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--color-text-main);
      letter-spacing: -0.8px;
      line-height: 1;
    }

    .rate-counter {
      margin-top: 2px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--color-text-muted);
    }

    .top-bar-actions {
      display: flex;
      gap: 6px;
    }

    .icon-button {
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid var(--color-border);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0 !important;
      transition: transform 0.12s ease, background-color 0.2s;
    }

    .icon-button svg {
      display: block !important;
      margin: auto !important;
      flex-shrink: 0;
    }

    .icon-button:active {
      transform: scale(0.9);
      background-color: var(--color-bg-secondary);
    }

    .boosts-bar {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      padding: 2px 12px 4px;
      z-index: 15;
    }

    .ad-boost-pill {
      border: none;
      background: linear-gradient(135deg, var(--color-accent-mint), #258f64);
      color: #fff;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.76rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(46, 163, 115, 0.3);
      transition: transform 0.12s ease;
    }

    .ad-boost-pill:active { transform: scale(0.95); }

    .ad-boost-pill.inactive {
      background: linear-gradient(135deg, #9d8e87, #84756f);
      box-shadow: none;
    }
    /* Игровая зона клика */
    .click-zone {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 2px 0 4px;
      overflow: hidden;
      z-index: 10;
    }

    .location-badge {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid var(--color-border);
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--color-text-muted);
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .floating-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 35;
    }

    .floating-number {
  position: absolute;
  pointer-events: none;
  user-select: none;
  font-family: inherit;
  font-weight: 900;
  font-size: 24px;
  color: #ff4757; /* Яркий акцентный кораллово-красный */
  /* Плотная белая обводка со всех сторон + мягкая тень */
  text-shadow: 
    -2px -2px 0 #ffffff,
     2px -2px 0 #ffffff,
    -2px  2px 0 #ffffff,
     2px  2px 0 #ffffff,
     0 3px 8px rgba(92, 40, 10, 0.25);
  animation: floatUp 0.8s ease-out forwards;
  z-index: 100;
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translate(-50%, 0) scale(0.8);
  }
  20% {
    opacity: 1;
    transform: translate(-50%, -15px) scale(1.15);
  }
  70% {
    opacity: 1;
    transform: translate(-50%, -40px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -60px) scale(0.9);
  }
}

    .floating-number.fever {

      margin-bottom: 2px;
      color: var(--color-text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Плашка бонуса: нежно-розовый фон с контрастным коралловым текстом */
    .wardrobe-bonus-badge {
      font-size: 0.62rem;
      font-weight: 800;
      color: #d32f2f;
      background: #ffebee;
      border: 1px solid #ffcdd2;
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .wardrobe-desc {
      font-size: 0.65rem;
      color: var(--color-text-muted);
      margin-bottom: 6px;
      line-height: 1.15;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wardrobe-btn {
      width: 100%;
      padding: 6px 0;
      font-size: 0.74rem;
      font-weight: 900;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .wardrobe-btn:not(:disabled):active { transform: scale(0.95); }

    /* Насыщенная кораллово-красная кнопка покупки с мягкой тенью */
    .wardrobe-btn.buy {
      background: linear-gradient(135deg, #ff4757, #e84118);
      color: #ffffff;
      box-shadow: 0 2px 8px var(--color-coral-shadow);
    }

    .wardrobe-btn.buy:disabled {
      background: #c8b7ae;
      cursor: not-allowed;
      opacity: 0.6;
      box-shadow: none;
    }

    .wardrobe-btn.equip {
      background: #faede0;
      color: var(--color-text-main);
      border: 1px solid var(--color-border);
    }

    .wardrobe-btn.unequip {
      background: rgba(239, 68, 68, 0.1);
      border: 1.5px solid #ef4444;
      color: #dc2626;
    }

    .wardrobe-btn.base-locked {
      background: #f1f5f9;
      color: #64748b;
      border: 1.5px solid #cbd5e1;
      cursor: default;
    }

    .wardrobe-btn.loc-locked {
      background: #e2e8f0;
      color: #64748b;
      border: 1.5px solid #cbd5e1;
      cursor: not-allowed;
      font-size: 0.7rem;
    }
    /* Модальные окна */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(25, 18, 14, 0.72);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 100;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-card {
      width: 100%;
      max-width: 375px;
      max-height: 88vh;
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-card);
      border: 2px solid var(--color-border);
      position: relative;
      animation: modalPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalPop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1.5px solid var(--color-border-subtle);
      padding-bottom: 6px;
    }

    .modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1rem;
      font-weight: 900;
    }

    .btn-close-modal {
      background: var(--color-bg-secondary);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-weight: 900;
    }

    .modal-scroll-body {
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .achievement-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--color-border);
      background: #fafafa;
      gap: 6px;
    }

    .achievement-item.unlocked {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .ach-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .ach-icon {
      font-size: 1.4rem;
      filter: grayscale(1);
      opacity: 0.6;
    }

    .achievement-item.unlocked .ach-icon {
      filter: none;
      opacity: 1;
    }

    .ach-texts {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .ach-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--color-text-main);
    }

    .ach-desc {
      font-size: 0.7rem;
      color: var(--color-text-muted);
    }

    .ach-status-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .ach-status-badge.done {
      background: #dcfce7;
      color: #166534;
    }

    .ach-status-badge.locked {
      background: #f3f4f6;
      color: #6b7280;
    }
    /* Настройки и пульт разработчика */
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 2px 0;
      overflow-y: auto;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-bg-secondary);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
    }

    .settings-label {
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toggle-btn {
      background: var(--color-accent-mint);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-weight: 800;
      font-size: 0.76rem;
      cursor: pointer;
    }

    .toggle-btn.off { background: #9ca3af; }

    .devtools-box {
      margin-top: 2px;
      padding: 9px;
      background: #f8fafc;
      border: 1.5px dashed #64748b;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .devtools-title {
      font-size: 0.75rem;
      font-weight: 900;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .devtools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }

    .devtools-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .dev-btn {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      padding: 5px 4px;
      border-radius: var(--radius-xs);
      font-size: 0.68rem;
      font-weight: 800;
      color: #334155;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: background-color 0.12s, transform 0.08s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
    }

    .dev-btn:active {
      background-color: #e2e8f0;
      transform: scale(0.97);
    }

    .dev-btn.accent {
      background: #fff7ed;
      border-color: #fdba74;
      color: #c2410c;
    }

    .dev-btn.emerald {
      background: #ecfdf5;
      border-color: #6ee7b7;
      color: #047857;
    }

    .reset-danger-box {
      margin-top: 2px;
      padding: 9px;
      background: #fef2f2;
      border: 1.5px dashed #fca5a5;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
    }

    .reset-warning-text {
      font-size: 0.7rem;
      color: #991b1b;
      font-weight: 700;
    }

    .btn-danger-reset {
      border: none;
      background: #dc2626;
      color: #fff;
      padding: 7px;
      border-radius: var(--radius-sm);
      font-weight: 900;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .btn-danger-confirm {
      border: none;
      background: #991b1b;
      color: #fff;
      padding: 7px;
      border-radius: var(--radius-sm);
      font-weight: 900;
      font-size: 0.78rem;
      cursor: pointer;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }
    /* Всплывающий тост */
    .toast-card {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.98);
      border: 2px solid var(--color-accent-gold);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 22px rgba(255, 152, 0, 0.35);
      z-index: 200;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
    }

    .toast-card.hidden {
      transform: translateY(-140%);
      opacity: 0;
      pointer-events: none;
    }

    .toast-icon { font-size: 1.6rem; }

    .toast-badge {
      font-size: 0.65rem;
      font-weight: 900;
      color: var(--color-accent-gold);
      text-transform: uppercase;
    }

    .toast-title { font-size: 0.84rem; font-weight: 800; }

    .toast-reward {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--color-primary);
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* Летающая золотая рыбка */
    .flying-fish-entity {
      position: absolute;
      width: 46px;
      height: 46px;
      z-index: 60;
      cursor: pointer;
      filter: drop-shadow(0 4px 10px rgba(255, 152, 0, 0.7));
      transition: transform 0.1s ease;
      touch-action: manipulation;
    }

    .flying-fish-entity:active { transform: scale(1.25); }

    .fish-sparkle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(circle, #fff8e1 0%, #ffb300 70%, rgba(255, 179, 0, 0) 100%);
      box-shadow: 0 0 6px #ffca28;
      z-index: 59;
      animation: sparkleFade 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes sparkleFade {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    }

    /* Интерактивная посылка-сюрприз */
    .mystery-box {
      position: absolute;
      top: 18%;
      right: 24px;
      width: 48px;
      height: 48px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background: transparent;
      box-shadow: none;
      border: none;
      padding: 0;
      animation: boxFloat 0.8s infinite alternate ease-in-out;
    }

    .mystery-box.hidden {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }

    .box-inner {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .box-inner svg {
      width: 48px;
      height: 48px;
      display: block;
      pointer-events: none;
    }

    .box-badge-taps {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 800;
      background: #ff4757;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    .mystery-box.shake {
      animation: boxShakeSide 0.25s ease-out !important;
    }

    @keyframes boxFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-8px) scale(0.97, 1.03) rotate(3deg); }
    }

    @keyframes boxShakeSide {
      0%, 100% { transform: scale(1.15) rotate(0); }
      25% { transform: scale(1.15) rotate(-9deg); }
      75% { transform: scale(1.15) rotate(9deg); }
    }

    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      pointer-events: none;
      z-index: 95;
      border-radius: 2px;
      animation: confettiExplode 0.65s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes confettiExplode {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.4) rotate(var(--rot)); }
    }

    .box-reward-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-bg-secondary);
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      margin-bottom: 14px;
      border: 1.5px solid var(--color-border);
      align-self: center;
    }

    .box-reward-val {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div id="app-root" class="app-container theme-bakery-0">
    <!-- Глобальные SVG ресурсы -->
    <svg width="0" height="0" style="position:absolute; pointer-events:none;">
      <defs>

          <stop offset="0%" stop-color="#FFD54F" />

          <stop offset="0%" stop-color="#FFF59D" />

        <!-- Сочный изумрудно-мятный градиент для клубков пряжи -->
        <linearGradient id="yarnBallEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">

        <!-- Векторная золотая рыбка -->
        <g id="universal-gold-fish">

          <path d="M 16 8 Q 18 12 16 16" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.55" stroke-linecap="round" />
          <circle cx="19.5" cy="10.2" r="1.6" fill="#261710" />
          <circle cx="20" cy="9.8" r="0.65" fill="#FFFFFF" />
          <circle cx="19.2" cy="10.7" r="0.3" fill="#FFFFFF" />
          <path d="M 22.2 12.8 Q 21.5 13.5 20.8 13" fill="none" stroke="#9A3412" stroke-width="0.7" stroke-linecap="round" />
        </g>

        <!-- Универсальный изумрудно-мятный клубок пряжи -->

        <!-- Аккуратный инлайн-SVG поварского колпачка для карточки базового гардероба -->
        <g id="wardrobe-icon-chef-hat">
          <path d="M 6 16 C 3 10, 5 5, 11 5 C 13 2, 18 2, 20 5 C 26 5, 28 10, 25 16 Z" fill="#FFFDF5" stroke="#3D2314" stroke-width="1.4" stroke-linejoin="round" />

          <line x1="7" y1="17.5" x2="24" y2="17.5" stroke="#FF8A80" stroke-width="0.8" stroke-linecap="round" />
        </g>

        <!-- Векторная миниатюра королевского берета для иконок гардероба -->
        <g id="wardrobe-icon-beret">
          <path d="M 4 14 C 2 8, 8 4, 14 5 C 20 3, 23 6, 22 11 C 20 13, 16 14, 13 14 C 9 14, 6 15, 4 14 Z" fill="#881337" stroke="#38040E" stroke-width="1.2" stroke-linejoin="round" />

          <path d="M 18 12 Q 22 6, 25 5 Q 23 9, 19 13 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />

        <!-- Векторная миниатюра золотого ордена для иконки гардероба -->

          <circle cx="12" cy="12" r="9.5" fill="url(#goldMedalBroochGrad)" stroke="#3D2314" stroke-width="1.2" />
          <circle cx="12" cy="12" r="7.2" fill="none" stroke="#B45309" stroke-width="0.7" stroke-dasharray="1.5,1.2" />
          <!-- Тиснёная лапка по центру -->
          <ellipse cx="12" cy="13.2" rx="3" ry="2.2" fill="#B45309" />
          <circle cx="9.2" cy="9.8" r="1.1" fill="#B45309" />

      </defs>
    </svg>
    <!-- Верхняя панель валют -->
    <header class="top-bar">
      <div class="top-bar-currencies">
        <div class="currency-badge stars" title="Звёзды Мишлен">
          <svg class="icon-svg-badge" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L14.9 8.5L22 9.2L16.7 14L18.2 21L12 17.3L5.8 21L7.3 14L2 9.2L9.1 8.5L12 2Z" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>

    function hasWardrobeUnlocked(state, id) {
      return Array.isArray(state?.meta?.wardrobe?.unlocked) && state.meta.wardrobe.unlocked.includes(id);
    }

    function getMaxFeverDuration(state) {
      const jarLvl = state.meta?.shop?.fishJar || 0;
      let duration = 15.0 + jarLvl * 2.0;
      if (hasWardrobeUnlocked(state, 'red_bow')) {
        duration += 2.0;
      }
      return duration;
    }

    function getPrestigeThresholds(allTime, state) {
      const inspectorLvl = state?.meta?.perks?.generous_inspector || 0;
      const discountMult = 1 - Math.min(0.25, inspectorLvl * 0.05);
      let threshold = Math.floor(1000000 * discountMult);
      let prevThreshold = 0;
      while (allTime >= threshold) {
        prevThreshold = threshold;
        threshold *= 5;
      }
      return { prev: prevThreshold, next: threshold };
    }

    function calculatePrestigeReward(state) {
      const allTime = state.stats?.totalCookiesAllTime || 0;
      const inspectorLvl = state?.meta?.perks?.generous_inspector || 0;
      const discountMult = 1 - Math.min(0.25, inspectorLvl * 0.05);
      let eligibleStars = 0;
      let threshold = Math.floor(1000000 * discountMult);
      while (allTime >= threshold) {
        eligibleStars++;
        threshold *= 5;
      }
      return Math.max(0, eligibleStars - (state.meta?.lifetimeStars || 0));
    }

    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      },
      playClick(isMuted) {
        if (isMuted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const t = this.ctx.currentTime;
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(140, t + 0.06);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.07);
        } catch (e) {}
      },
      playBuy(isMuted) {
        if (isMuted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          [587.33, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t + idx * 0.06);
            gain.gain.setValueAtTime(0.2, t + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.06 + 0.12);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t + idx * 0.06);
            osc.stop(t + idx * 0.06 + 0.13);
          });
        } catch (e) {}
      },
      playFever(isMuted) {
        if (isMuted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + idx * 0.07);
            gain.gain.setValueAtTime(0.25, t + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.07 + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(t + idx * 0.07);
            osc.stop(t + idx * 0.07 + 0.19);
          });

            equippedNeck: 'neck_none'
          },
          achievements: []
        },
        tutorials: {
          prestigeSeen: false,
          shopSeen: false,
          wardrobeSeen: false
        },
        boosts: {
          adMultiplierExpiresAt: 0,
          feverActive: false,
          feverProgress: 0
        },
        timestamps: {
          lastSaveTime: now,
          firstStartTime: now
        },
        settings: {
          soundMuted: false,
          musicMuted: false
        },
        stats: {
          totalClicks: 0,
          totalCookiesAllTime: 0
        }
      };
    }

    function sanitizeNumber(val, fallback = 0) {
      if (typeof val !== 'number' || !Number.isFinite(val) || Number.isNaN(val) || val < 0) {
        return fallback;
      }
      return val;
    }

    function validateAndMigrateState(raw) {
      const defaults = createInitialState();
      if (!raw || typeof raw !== 'object') return defaults;

      const data = raw;
      const mergedGenerators = { ...defaults.run.generators };
      if (data.run?.generators) {
        for (const id of GENERATOR_IDS) {
          mergedGenerators[id] = Math.floor(sanitizeNumber(data.run.generators[id], 0));
        }
      }

      const mergedPerks = { ...defaults.meta.perks };
      if (data.meta?.perks) {
        for (const id of PERK_IDS) {
          mergedPerks[id] = Math.floor(sanitizeNumber(data.meta.perks[id], 0));
        }
      }

      const parsedStars = Math.floor(sanitizeNumber(data.meta?.stars, 0));
      const parsedLifetimeStars = Math.max(parsedStars, Math.floor(sanitizeNumber(data.meta?.lifetimeStars, 0)));
      const parsedPrestigeCount = Math.floor(sanitizeNumber(data.meta?.prestigeCount, 0));

      let wardrobeUnlocked = ['chef_hat_1', 'neck_none'];
      let equippedHead = 'chef_hat_1';
      let equippedNeck = 'neck_none';

      if (parsedPrestigeCount >= 1) {
        wardrobeUnlocked.push('chef_hat_2', 'red_bowtie');
      }
      if (parsedPrestigeCount >= 2) {
        wardrobeUnlocked.push('beret_royal', 'gold_medal');
      }

      if (data.meta?.wardrobe) {
        const oldUnlocked = Array.isArray(data.meta.wardrobe.unlocked) ? data.meta.wardrobe.unlocked : [];
        oldUnlocked.forEach((id) => {
          if (id === 'none') return;
          // Предотвращаем разблокировку престижных шапок раньше времени при миграции
          if ((id === 'chef_hat_2' || id === 'red_bowtie') && parsedPrestigeCount < 1) return;
          if ((id === 'beret_royal' || id === 'gold_medal') && parsedPrestigeCount < 2) return;

          if (id === 'golden_monocle' && !wardrobeUnlocked.includes('devil_horns')) {
            wardrobeUnlocked.push('devil_horns');
          } else if (id === 'cherry_flower' && !wardrobeUnlocked.includes('flower_wreath')) {
            wardrobeUnlocked.push('flower_wreath');
          } else if (id === 'angel_halo' && !wardrobeUnlocked.includes('love_hearts')) {
            wardrobeUnlocked.push('love_hearts');
          } else if (!wardrobeUnlocked.includes(id)) {
            wardrobeUnlocked.push(id);
          }
        });

        if (typeof data.meta.wardrobe.equippedHead === 'string') {
          equippedHead = data.meta.wardrobe.equippedHead;
        } else if (typeof data.meta.wardrobe.equipped === 'string') {
          const oldEq = data.meta.wardrobe.equipped;
          if (oldEq === 'golden_monocle') equippedHead = 'devil_horns';
          else if (oldEq === 'cherry_flower') equippedHead = 'flower_wreath';
          else if (oldEq === 'angel_halo') equippedHead = 'love_hearts';
          else if (oldEq !== 'none') equippedHead = oldEq;
        }

        if (typeof data.meta.wardrobe.equippedNeck === 'string') {
          equippedNeck = data.meta.wardrobe.equippedNeck;
        } else {
          if (parsedPrestigeCount === 1) equippedNeck = 'red_bowtie';
          else if (parsedPrestigeCount >= 2) equippedNeck = 'gold_medal';
        }
      }

      // Проверка валидности надетого головного убора
      if (equippedHead === 'chef_hat_2' && parsedPrestigeCount < 1) equippedHead = 'chef_hat_1';
      if (equippedHead === 'beret_royal' && parsedPrestigeCount < 2) equippedHead = 'chef_hat_1';
      if (equippedNeck === 'red_bowtie' && parsedPrestigeCount < 1) equippedNeck = 'neck_none';
      if (equippedNeck === 'gold_medal' && parsedPrestigeCount < 2) equippedNeck = 'neck_none';

      return {
        version: 52,
        run: {
          cookies: Math.floor(sanitizeNumber(data.run?.cookies, defaults.run.cookies)),
          lifetimeCookiesRun: Math.floor(sanitizeNumber(data.run?.lifetimeCookiesRun, 0)),
          clickLevel: Math.max(1, Math.floor(sanitizeNumber(data.run?.clickLevel, 1))),
          generators: mergedGenerators
        },
        meta: {
          stars: parsedStars,
          lifetimeStars: parsedLifetimeStars,
          fish: Math.floor(sanitizeNumber(data.meta?.fish, 0)),
          yarn: Math.floor(sanitizeNumber(data.meta?.yarn, 0)),
          prestigeCount: parsedPrestigeCount,
          perks: mergedPerks,
          shop: {
            catnip: Math.floor(sanitizeNumber(data.meta?.shop?.catnip, 0)),
            goldenRollingPin: Math.floor(sanitizeNumber(data.meta?.shop?.goldenRollingPin, 0)),
            creamSauce: Math.floor(sanitizeNumber(data.meta?.shop?.creamSauce || data.meta?.shop?.eternalEnergy, 0)),
            catBell: Math.min(5, Math.floor(sanitizeNumber(data.meta?.shop?.catBell, 0))),
            fishJar: Math.floor(sanitizeNumber(data.meta?.shop?.fishJar, 0))
          },
          wardrobe: {
            unlocked: Array.from(new Set(wardrobeUnlocked)),
            equippedHead: equippedHead,
            equippedNeck: equippedNeck
          },
          achievements: Array.isArray(data.meta?.achievements) ? data.meta.achievements : []
        },
        tutorials: {
          prestigeSeen: !!data.tutorials?.prestigeSeen,
          shopSeen: !!data.tutorials?.shopSeen,
          wardrobeSeen: !!data.tutorials?.wardrobeSeen
        },
        boosts: {
          adMultiplierExpiresAt: sanitizeNumber(data.boosts?.adMultiplierExpiresAt, 0),
          feverActive: !!data.boosts?.feverActive,
          feverProgress: Math.min(100, sanitizeNumber(data.boosts?.feverProgress, 0))
        },
        timestamps: {
          lastSaveTime: sanitizeNumber(data.timestamps?.lastSaveTime, Date.now()),
          firstStartTime: sanitizeNumber(data.timestamps?.firstStartTime, Date.now())
        },
        settings: {
          soundMuted: !!data.settings?.soundMuted,
          musicMuted: !!data.settings?.musicMuted
        },
        stats: {
          totalClicks: Math.floor(sanitizeNumber(data.stats?.totalClicks, 0)),
          totalCookiesAllTime: Math.floor(sanitizeNumber(data.stats?.totalCookiesAllTime, 0))
        }
      };
    }

    function saveToLocal(state) {
      try {
        state.timestamps.lastSaveTime = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {}
    }

    function loadFromLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        return validateAndMigrateState(JSON.parse(raw));
      } catch (e) {
        return createInitialState();
      }
    }
    /* Форматирование чисел и таймеров */
    const NUMBER_SUFFIXES = ['', ' тыс.', ' млн.', ' млрд.', ' трлн.', ' квдр.', ' квнт.'];

    function formatNumber(num) {
      if (typeof num !== 'number' || !Number.isFinite(num) || Number.isNaN(num) || num <= 0) {
        return '0';
      }
      if (num < 1000) {
        return Math.floor(num).toLocaleString('ru-RU');
      }
      const tier = Math.floor(Math.log10(num) / 3);
      if (tier < NUMBER_SUFFIXES.length) {
        const suffix = NUMBER_SUFFIXES[tier];
        const scale = Math.pow(10, tier * 3);
        const scaled = num / scale;
        let decimals = scaled >= 100 ? 0 : scaled >= 10 ? 1 : 2;
        return `${scaled.toFixed(decimals)}${suffix}`;
      }
      return num.toExponential(2).replace('e+', 'e');
    }

    function formatTime(totalSeconds, mode = 'timer') {
      const safeSeconds = Math.max(0, Math.floor(totalSeconds));
      const hours = Math.floor(safeSeconds / 3600);
      const minutes = Math.floor((safeSeconds % 3600) / 60);
      const seconds = safeSeconds % 60;

      if (mode === 'duration') {
        const parts = [];
        if (hours > 0) parts.push(`${hours} ч`);
        if (minutes > 0 || hours > 0) parts.push(`${minutes} мин`);
        if (parts.length === 0) parts.push(`${seconds} сек`);
        return parts.join(' ');
      }

      const mm = String(minutes).padStart(2, '0');
      const ss = String(seconds).padStart(2, '0');
      return hours > 0 ? `${String(hours).padStart(2, '0')}:${mm}:${ss}` : `${mm}:${ss}`;
    }

    function getGeneratorMilestoneMultiplier(count) {
      let milestoneMult = 1;
      if (count >= 25) milestoneMult *= 2;
      if (count >= 50) milestoneMult *= 2;
      if (count >= 100) milestoneMult *= 2;
      if (count >= 200) milestoneMult *= 2;
      return milestoneMult;
    }

    function getGeneratorCurrentRate(generatorId, state) {
      const config = GENERATORS_CONFIG[generatorId];
      if (!config) return 0;
      const count = state.run.generators[generatorId] || 0;
      if (count <= 0) return 0;
      return config.baseRate * count * getGeneratorMilestoneMultiplier(count);
    }

    function calculateTotalRate(state) {
      let baseTotalRate = 0;
      for (const id of GENERATOR_IDS) {
        baseTotalRate += getGeneratorCurrentRate(id, state);
      }
      const stars = state.meta.stars || 0;
      const prestigeMultiplier = 1 + stars * 0.25;
      const sauceLevel = state.meta?.shop?.creamSauce || 0;
      const shopSauceMultiplier = 1 + sauceLevel * 0.15;
      const isAdBoosted = (state.boosts.adMultiplierExpiresAt || 0) > Date.now();
      const adMultiplier = isAdBoosted ? 2 : 1;

      let wardrobeRateMult = 1.0;
      if (hasWardrobeUnlocked(state, 'chef_hat_2')) {
        wardrobeRateMult *= 1.03;
      }
      if (hasWardrobeUnlocked(state, 'flower_wreath')) {
        wardrobeRateMult *= 1.03;
      }
      if (hasWardrobeUnlocked(state, 'beret_royal')) {
        wardrobeRateMult *= 1.04;
      }
      if (hasWardrobeUnlocked(state, 'royal_crown')) {
        wardrobeRateMult *= 1.05;
      }

      return Math.floor(baseTotalRate * prestigeMultiplier * shopSauceMultiplier * adMultiplier * wardrobeRateMult);
    }

    function getCostWithDiscount(rawPrice, perkLevel = 0) {
      const discount = Math.min(0.05, Math.max(0, perkLevel) * 0.01);
      return rawPrice * (1 - discount);
    }

    function getSingleGeneratorCost(generatorId, state) {
      const config = GENERATORS_CONFIG[generatorId];
      if (!config) return Infinity;
      const count = state.run.generators[generatorId] || 0;
      const perkLevel = state.meta?.perks?.bulk_buy || 0;
      const rawCost = config.baseCost * Math.pow(config.costGrowthRate, count);
      return Math.floor(getCostWithDiscount(rawCost, perkLevel));
    }

    function getBatchCost(generatorId, countToBuy, state) {
      if (countToBuy <= 0) return 0;
      const config = GENERATORS_CONFIG[generatorId];
      if (!config) return Infinity;

      const k = state.run.generators[generatorId] || 0;
      const r = config.costGrowthRate;
      const perkLevel = state.meta?.perks?.bulk_buy || 0;
      const rawSum = config.baseCost * Math.pow(r, k) * ((Math.pow(r, countToBuy) - 1) / (r - 1));
      return Math.floor(getCostWithDiscount(rawSum, perkLevel));
    }

    function getMaxAffordable(generatorId, state) {
      const config = GENERATORS_CONFIG[generatorId];
      if (!config) return { count: 0, cost: 0, canAfford: false };

      const availableCookies = state.run.cookies;
      const singleCost = getSingleGeneratorCost(generatorId, state);
      if (availableCookies < singleCost) {
        return { count: 0, cost: singleCost, canAfford: false };
      }

      const k = state.run.generators[generatorId] || 0;
      const r = config.costGrowthRate;
      const perkLevel = state.meta?.perks?.bulk_buy || 0;
      const discountMultiplier = 1 - Math.min(0.05, Math.max(0, perkLevel) * 0.01);
      const currentStepBase = config.baseCost * Math.pow(r, k) * discountMultiplier;

      const argument = 1 + (availableCookies * (r - 1)) / currentStepBase;
      let maxCount = Math.floor(Math.log(Math.max(1, argument)) / Math.log(r));

      while (maxCount > 0 && getBatchCost(generatorId, maxCount, state) > availableCookies) {
        maxCount--;
      }
      while (getBatchCost(generatorId, maxCount + 1, state) <= availableCookies) {
        maxCount++;
      }

      if (maxCount <= 0) {
        return { count: 0, cost: singleCost, canAfford: false };
      }

      return { count: maxCount, cost: getBatchCost(generatorId, maxCount, state), canAfford: true };
    }

    function buyGenerator(generatorId, state, amount = 1) {
      let countToBuy = 0;
      let totalCost = 0;

      if (amount === 'max') {
        const affordable = getMaxAffordable(generatorId, state);
        countToBuy = affordable.count;
        totalCost = affordable.cost;
      } else {
        countToBuy = Math.max(0, Math.floor(Number(amount) || 0));
        totalCost = getBatchCost(generatorId, countToBuy, state);
      }

      if (countToBuy <= 0 || state.run.cookies < totalCost) {
        return { success: false, countBought: 0, totalCost: 0, milestoneSpiked: false };
      }

      const prevCount = state.run.generators[generatorId] || 0;
      const newCount = prevCount + countToBuy;

      state.run.cookies -= totalCost;
      state.run.generators[generatorId] = newCount;
      saveToLocal(state);

      const milestoneSpiked = MILESTONES.some(m => prevCount < m && newCount >= m);
      return { success: true, countBought: countToBuy, totalCost, milestoneSpiked };
    }

    function getGeneratorDisplayData(generatorId, state) {
      const config = GENERATORS_CONFIG[generatorId];
      if (!config) return null;

      const currentLevel = state.run.generators[generatorId] || 0;
      const nextCost = getSingleGeneratorCost(generatorId, state);
      const currentTotalRate = getGeneratorCurrentRate(generatorId, state);
      const canAfford = state.run.cookies >= nextCost;

      const nextMilestone = MILESTONES.find((threshold) => threshold > currentLevel) || null;
      let progress = 1;
      let progressText = '200/200';
      
      if (nextMilestone !== null) {
        const prevMilestone = [...MILESTONES].reverse().find((t) => t <= currentLevel) || 0;
        progress = Math.min(1, Math.max(0, (currentLevel - prevMilestone) / (nextMilestone - prevMilestone)));
        progressText = `${currentLevel}/${nextMilestone}`;
      } else {
        progressText = `${currentLevel}/200 (МАКС)`;
      }

      return {
        id: generatorId,
        name: config.name,
        currentLevel,
        nextCost,
        currentTotalRate,
        nextMilestone,
        milestoneProgress: progress,
        progressText,
        milestoneMult: getGeneratorMilestoneMultiplier(currentLevel),
        canAfford
      };
    }
    function getClickUpgradeCost(level) {
      return Math.floor(15 * Math.pow(1.12, Math.max(1, level) - 1));
    }

    function getClickPower(state) {
      const basePower = (1 + (state.meta.stars || 0)) * Math.max(1, state.run.clickLevel);
      const perkMult = 1 + (state.meta?.perks?.strong_paws || 0);
      const pinMult = 1 + (state.meta?.shop?.goldenRollingPin || 0) * 0.15;
      
      let wardrobeClickMult = 1.0;
      if (hasWardrobeUnlocked(state, 'glasses_cool')) {
        wardrobeClickMult *= 1.05;
      }
      if (hasWardrobeUnlocked(state, 'red_bowtie')) {
        wardrobeClickMult *= 1.03;
      }
      if (hasWardrobeUnlocked(state, 'beret_royal')) {
        wardrobeClickMult *= 1.04;
      }
      if (hasWardrobeUnlocked(state, 'royal_crown')) {
        wardrobeClickMult *= 1.05;
      }

      const clickUpgradesMult = perkMult * pinMult * wardrobeClickMult;
      const totalPassiveRate = calculateTotalRate(state);
      const synergyBase = totalPassiveRate * 0.01;
      const totalClickBeforeFever = (basePower + synergyBase) * clickUpgradesMult;
      const feverMult = state.boosts.feverActive ? 3 : 1;
      
      return Math.max(1, Math.round(totalClickBeforeFever * feverMult));
    }

    function buyClickUpgrade(state) {
      const cost = getClickUpgradeCost(state.run.clickLevel);
      if (state.run.cookies < cost) return false;
      state.run.cookies -= cost;
      state.run.clickLevel += 1;
      saveToLocal(state);
      return true;
    }

    function spawnFloatingNumber(container, clientX, clientY, amount, isFever) {
      if (!container) return;
      const rect = container.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      const el = document.createElement('div');
      el.className = `floating-number${isFever ? ' fever' : ''}`;
      el.textContent = `+${formatNumber(amount)}`;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;

      const cleanup = () => {
        if (el.parentNode === container) container.removeChild(el);
      };
      el.addEventListener('animationend', cleanup, { once: true });
      setTimeout(cleanup, 900);
      container.appendChild(el);
    }

    function spawnCrumbs(container, clientX, clientY) {
      if (!container) return;
      const rect = container.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      const count = 3 + Math.floor(Math.random() * 2);
      for (let i = 0; i < count; i++) {
        const crumb = document.createElement('div');
        crumb.className = 'crumb-particle';
        const size = 5 + Math.random() * 5;
        crumb.style.width = `${size}px`;
        crumb.style.height = `${size}px`;
        crumb.style.left = `${x}px`;
        crumb.style.top = `${y}px`;

        const angle = Math.random() * Math.PI * 2;
        const dist = 26 + Math.random() * 42;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;

        crumb.style.setProperty('--dx', `${dx}px`);
        crumb.style.setProperty('--dy', `${dy}px`);

        container.appendChild(crumb);
        setTimeout(() => {
          if (crumb.parentNode === container) crumb.remove();
        }, 350);
      }
    }

    let feverRemainingTimer = 0;

    function triggerFeverMode(state) {
      state.boosts.feverActive = true;
      state.boosts.feverProgress = 100;
      feverRemainingTimer = getMaxFeverDuration(state);
      SoundFX.playFever(state.settings.soundMuted);
    }

    function processTap(state, container, clientX, clientY) {
      const power = getClickPower(state);
      state.run.cookies += power;
      state.run.lifetimeCookiesRun += power;
      state.stats.totalCookiesAllTime += power;
      state.stats.totalClicks += 1;

      if (!state.boosts.feverActive) {
        const catnipLevel = state.meta?.shop?.catnip || 0;
        let feverGainMult = 1 + catnipLevel * 0.25;
        if (hasWardrobeUnlocked(state, 'love_hearts')) {
          feverGainMult *= 1.05;
        }
        state.boosts.feverProgress = Math.min(100, state.boosts.feverProgress + (4.0 * feverGainMult));
        if (state.boosts.feverProgress >= 100) {
          triggerFeverMode(state);
        }
      }

      SoundFX.playClick(state.settings.soundMuted);
      spawnFloatingNumber(container, clientX, clientY, power, state.boosts.feverActive);
      spawnCrumbs(container, clientX, clientY);
      return power;
    }

    function calculateOfflineProgress(state, overrideSeconds = null) {
      const now = Date.now();
      const firstStart = state.timestamps.firstStartTime || now;
      
      if (overrideSeconds === null && (now - firstStart) < 300 * 1000) {
        return { isEligible: false, baseEarned: 0, doubleEarned: 0, effectiveSeconds: 0 };
      }

      const lastSave = state.timestamps.lastSaveTime || now;
      const secondsAway = overrideSeconds !== null ? overrideSeconds : Math.floor((now - lastSave) / 1000);

      if (secondsAway < 60) {
        return { isEligible: false, baseEarned: 0, doubleEarned: 0, effectiveSeconds: 0 };
      }

      const capsHours = [4, 6, 8, 12];
      const perkLevel = state.meta?.perks?.cat_sleep || 0;
      const maxCapSeconds = (capsHours[Math.min(perkLevel, 3)] || 4) * 3600;
      const effectiveSeconds = Math.min(secondsAway, maxCapSeconds);

      const rate = calculateTotalRate(state);
      const baseEarned = Math.floor(effectiveSeconds * rate * 0.5);
      return {
        isEligible: baseEarned > 0,
        baseEarned,
        doubleEarned: baseEarned * 2,
        effectiveSeconds
      };
    }

    function checkAchievements(state, onUnlock) {
      if (!Array.isArray(state.meta.achievements)) {
        state.meta.achievements = [];
      }
      const set = new Set(state.meta.achievements);
      for (const ach of ACHIEVEMENTS_CONFIG) {
        if (!set.has(ach.id) && ach.isUnlocked(state)) {
          state.meta.achievements.push(ach.id);
          state.meta.fish += ach.rewardFish;
          saveToLocal(state);
          if (onUnlock) onUnlock(ach);
        }
      }
    }

      function spawnFlyingFish() {
        if (activeFlyingFish && activeFlyingFish.parentNode) {
          activeFlyingFish.remove();
        }

        const fish = document.createElement('div');
        fish.className = 'flying-fish-entity';
        fish.innerHTML = `<svg viewBox="0 0 24 24" style="width:100%;height:100%;"><use href="#universal-gold-fish" /></svg>`;

        const fromLeft = Math.random() > 0.5;
        const topY = 60 + Math.random() * 90;
        const startX = fromLeft ? -60 : 490;
        const endX = fromLeft ? 490 : -60;

        fish.style.top = `${topY}px`;
        fish.style.left = `${startX}px`;
        if (!fromLeft) fish.style.transform = 'scaleX(-1)';

        appRoot.appendChild(fish);
        activeFlyingFish = fish;

        const startTime = performance.now();
        const duration = 5000;
        let animationFrameId = null;
        let lastSparkleTime = 0;

        function moveFish(currTime) {
          const elapsed = currTime - startTime;
          const p = Math.min(1, elapsed / duration);
          const curX = startX + (endX - startX) * p;
          const wobbleY = Math.sin(p * Math.PI * 4) * 12;
          const actualY = topY + wobbleY;

          fish.style.left = `${curX}px`;
          fish.style.top = `${actualY}px`;

          if (currTime - lastSparkleTime > 75) {
            lastSparkleTime = currTime;
            const sparkle = document.createElement('div');
            sparkle.className = 'fish-sparkle';
            const sparkleSize = 4 + Math.random() * 6;
            sparkle.style.width = `${sparkleSize}px`;
            sparkle.style.height = `${sparkleSize}px`;
            sparkle.style.left = `${curX + (fromLeft ? 4 : 40)}px`;
            sparkle.style.top = `${actualY + 16 + (Math.random() * 10 - 5)}px`;
            appRoot.appendChild(sparkle);
            setTimeout(() => {
              if (sparkle.parentNode) sparkle.remove();
            }, 450);
          }

          if (p < 1 && activeFlyingFish === fish) {
            animationFrameId = requestAnimationFrame(moveFish);
          } else {
            if (activeFlyingFish === fish) {
              fish.remove();
              activeFlyingFish = null;
            }
          }
        }
        animationFrameId = requestAnimationFrame(moveFish);

        const onCatch = (e) => {
          e.stopPropagation();
          e.preventDefault();
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
          if (fish.parentNode) fish.remove();
          activeFlyingFish = null;

          SoundFX.playFever(state.settings.soundMuted);

          const roll = Math.random();
          if (roll < 0.70) {
            let fishDuration = 180;
            if (hasWardrobeUnlocked(state, 'devil_horns')) {
              fishDuration *= 1.10;
            }
            if (hasWardrobeUnlocked(state, 'gold_medal')) {
              fishDuration *= 1.15;
            }
            const jackpot = Math.max(50, Math.floor(calculateTotalRate(state) * fishDuration));
            state.run.cookies += jackpot;
            state.run.lifetimeCookiesRun += jackpot;
            state.stats.totalCookiesAllTime += jackpot;
            showGenericToast('🐟', 'Золотая Рыбка поймана!', 'Щедрый улов выпечки!', `+${formatNumber(jackpot)} 🐾`);
          } else if (roll < 0.90) {
            triggerFeverMode(state);
            const dur = Math.round(getMaxFeverDuration(state));
            showGenericToast('⚡', 'Золотая Рыбка поймана!', 'Всплеск вдохновения!', `Лихорадка на ${dur} сек!`);
          } else {
            state.meta.fish += 1;
            showGenericToast('✨', 'Золотая Рыбка поймана!', 'Редкая драгоценность!', `+1 ${getFishIconSvg(18)}`);
          }

          saveToLocal(state);
          renderStaticUI();
        };

        fish.addEventListener('pointerdown', onCatch);
      }

      function renderGeneratorsList() {
        const targetContainer = tabPanes.generators;
        targetContainer.innerHTML = '';

        GENERATOR_IDS.forEach((id) => {
          const data = getGeneratorDisplayData(id, state);
          if (!data) return;

          let countToBuy = 1;
          let cost = data.nextCost;
          let canBuy = false;

          if (currentBatchMode === '10') {
            countToBuy = 10;
            cost = getBatchCost(id, 10, state);
            canBuy = state.run.cookies >= cost && cost > 0;
          } else if (currentBatchMode === 'max') {
            const maxInfo = getMaxAffordable(id, state);
            if (maxInfo.count > 0) {
              countToBuy = maxInfo.count;
              cost = maxInfo.cost;
              canBuy = state.run.cookies >= cost;
            } else {
              countToBuy = 1;
              cost = maxInfo.cost;
              canBuy = false;
            }
          } else {
            countToBuy = 1;
            cost = data.nextCost;
            canBuy = state.run.cookies >= cost && cost > 0;
          }

          const card = document.createElement('div');
          card.className = `generator-card${canBuy ? ' can-afford' : ''}`;
          card.dataset.cardGenId = id;

          const spikeBadge = data.milestoneMult > 1 
            ? `<span class="milestone-badge-spike">x${data.milestoneMult} СКОРОСТЬ!</span>` 
            : '';

          card.innerHTML = `

              <div class="generator-avatar">${GENERATOR_ICONS[id] || getSvgIcon('paw', 24)}</div>

              </div>

            <button class="gen-buy-btn" data-gen-id="${id}" ${!canBuy ? 'disabled' : ''}>
              <span class="btn-buy-count">+${countToBuy}</span>

          const buyBtn = card.querySelector('.gen-buy-btn');
          buyBtn.addEventListener('click', () => {
            const result = buyGenerator(id, state, currentBatchMode === 'max' ? 'max' : countToBuy);
            if (result.success) {

              if (result.milestoneSpiked) {
                SoundFX.playFever(state.settings.soundMuted);

      function performPrestige() {
        const rewardStars = calculatePrestigeReward(state);
        if (rewardStars <= 0) return;

        const prevPrestige = state.meta.prestigeCount || 0;

        state.meta.stars += rewardStars;
        state.meta.lifetimeStars += rewardStars;
        state.meta.prestigeCount += 1;

        if (state.meta.prestigeCount === 1) {
          state.meta.yarn += 5;
          if (!state.meta.wardrobe.unlocked.includes('chef_hat_2')) state.meta.wardrobe.unlocked.push('chef_hat_2');
          if (!state.meta.wardrobe.unlocked.includes('red_bowtie')) state.meta.wardrobe.unlocked.push('red_bowtie');
          state.meta.wardrobe.equippedHead = 'chef_hat_2';
          state.meta.wardrobe.equippedNeck = 'red_bowtie';
        } else if (state.meta.prestigeCount >= 2) {
          state.meta.yarn += 10;
          if (!state.meta.wardrobe.unlocked.includes('beret_royal')) state.meta.wardrobe.unlocked.push('beret_royal');
          if (!state.meta.wardrobe.unlocked.includes('gold_medal')) state.meta.wardrobe.unlocked.push('gold_medal');
          state.meta.wardrobe.equippedHead = 'beret_royal';
          state.meta.wardrobe.equippedNeck = 'gold_medal';
        }

        const vanLevel = state.meta?.perks?.start_van || 0;

        state.run.cookies = 0;
        state.run.lifetimeCookiesRun = 0;
        state.run.clickLevel = 1;
        subCookieAccumulator = 0;

        for (const id of GENERATOR_IDS) {
          state.run.generators[id] = 0;
        }

        if (vanLevel > 0) {
          state.run.generators.lapkolap = vanLevel * 2;
        }

        updateCatVisuals(state);
        SoundFX.playFever(state.settings.soundMuted);
        saveToLocal(state);
        checkAchievements(state, showAchievementToast);
        renderStaticUI();

        if (prevPrestige === 0 && state.meta.prestigeCount === 1) {
          showTutorial(
            '🥐✨',
            'Новый филиал: Городское кафе!',
            'Поздравляем! Ваша пекарня вышла на городской уровень! Котику открылись высокий колпак шефа и шейная бабочка, а также начислено +5 зелёных клубков пряжи!',
            'Великолепно! 🐾'
          );
        } else if (prevPrestige === 1 && state.meta.prestigeCount >= 2) {
          showTutorial(
            '👑✨',
            'Новый филиал: Королевский дворец!',
            'Триумф кондитерского искусства! На груди засиял золотой орден мастера с лапкой, открылся бархатный берет с пером и получено +10 зелёных клубков пряжи!',
            'Вперёд к новым вершинам! 🐾'
          );
        }
      }

      function renderWardrobeView() {
        const targetContainer = tabPanes.wardrobe;
        targetContainer.innerHTML = `
          <div class="wardrobe-slots-nav">
            <button id="slot-tab-head" class="wardrobe-slot-tab ${activeWardrobeSlot === 'head' ? 'active' : ''}">Головные уборы и эффекты</button>
            <button id="slot-tab-neck" class="wardrobe-slot-tab ${activeWardrobeSlot === 'neck' ? 'active' : ''}">Шея и аксессуары</button>
          </div>
          <div class="wardrobe-grid" id="wardrobe-grid-content"></div>
        `;

        targetContainer.querySelector('#slot-tab-head').addEventListener('click', () => {
          activeWardrobeSlot = 'head';
          renderWardrobeView();
        });

        targetContainer.querySelector('#slot-tab-neck').addEventListener('click', () => {
          activeWardrobeSlot = 'neck';
          renderWardrobeView();
        });

        const grid = targetContainer.querySelector('#wardrobe-grid-content');
        const items = WARDROBE_CATALOG[activeWardrobeSlot] || [];
        const unlocked = new Set(state.meta?.wardrobe?.unlocked || []);
        const currentStage = state.meta?.prestigeCount || 0;
        const equippedCurrent = activeWardrobeSlot === 'head' 
          ? state.meta?.wardrobe?.equippedHead 
          : state.meta?.wardrobe?.equippedNeck;

        items.forEach((item) => {
          const isUnlocked = unlocked.has(item.id);
          const isEquipped = equippedCurrent === item.id;
          const canAfford = state.meta.yarn >= item.cost;
          const isStageLocked = (item.unlockStage !== undefined && currentStage < item.unlockStage);

          const card = document.createElement('div');
          card.className = `wardrobe-card${isEquipped ? ' equipped' : ''}`;

          let btnClass = 'buy';
          let btnText = item.cost === 0 ? 'Получить' : `Купить ${item.cost} ${getYarnIconSvg(14)}`;
          let btnDisabled = false;

          // Стало:
          /* ЖЁСТКАЯ БЛОКИРОВКА ПРЕСТИЖНЫХ ШАПОК И АКСЕССУАРОВ */
          if (isStageLocked) {
            btnClass = 'loc-locked';
            btnText = `🔒 Локация ${item.unlockStage + 1}`;
            btnDisabled = true;
          } else if (item.isBase) {
            btnClass = 'base-locked';
            btnText = 'По умолчанию ✓';
            btnDisabled = true;
          } else if (isEquipped) {
            /* Кнопка «Снять ✕» доступна ТОЛЬКО на надетых купленных/престижных вещах */
            btnClass = 'unequip';
            btnText = 'Снять ✕';
          } else if (isUnlocked) {
            btnClass = 'equip';
            btnText = 'Надеть';
          } else {
            btnDisabled = !canAfford;
          }

          let previewContent = item.icon || getSvgIcon('bow', 28);
          if (item.iconSvg) {
            previewContent = `<svg width="34" height="34" viewBox="0 0 28 24"><use href="#${item.iconSvg}" /></svg>`;
          }

          card.innerHTML = `
            <div class="wardrobe-preview">${previewContent}</div>
            <div class="wardrobe-title">${item.name}</div>
            <div class="wardrobe-bonus-badge">${item.bonusDesc}</div>
            <div class="wardrobe-desc">${item.desc}</div>
            <button class="wardrobe-btn ${btnClass}" ${btnDisabled ? 'disabled' : ''}>${btnText}</button>
          `;

          const btn = card.querySelector('.wardrobe-btn');
          btn.addEventListener('click', () => {
            if (isStageLocked) return;
            if (item.isBase && isEquipped) return;

            if (isEquipped) {
              /* Снятие аксессуара мгновенно возвращает слот к базовому виду */
              if (activeWardrobeSlot === 'head') {
                state.meta.wardrobe.equippedHead = 'chef_hat_1';
              } else {
                state.meta.wardrobe.equippedNeck = 'neck_none';
              }
              SoundFX.playClick(state.settings.soundMuted);
              saveToLocal(state);
              updateCatVisuals(state);
              renderWardrobeView();
            } else if (isUnlocked) {
              if (activeWardrobeSlot === 'head') {
                state.meta.wardrobe.equippedHead = item.id;
              } else {
                state.meta.wardrobe.equippedNeck = item.id;
              }
              SoundFX.playBuy(state.settings.soundMuted);
              saveToLocal(state);
              updateCatVisuals(state);
              renderWardrobeView();
            } else {
              if (state.meta.yarn >= item.cost) {
                state.meta.yarn -= item.cost;
                if (!state.meta.wardrobe.unlocked.includes(item.id)) {
                  state.meta.wardrobe.unlocked.push(item.id);
                }
                if (activeWardrobeSlot === 'head') {
                  state.meta.wardrobe.equippedHead = item.id;
                } else {
                  state.meta.wardrobe.equippedNeck = item.id;
                }
                SoundFX.playFever(state.settings.soundMuted);
                saveToLocal(state);
                updateCatVisuals(state);
                renderStaticUI();
                showGenericToast('🎀', 'Гардероб шефа!', `Открыто: ${item.name}!`, `${item.bonusDesc} активен! ✨`);
              }
            }
          });

          grid.appendChild(card);
        });
      }

        starsDisplay.textContent = formatNumber(state.meta?.stars || 0);
        fishDisplay.textContent = formatNumber(state.meta?.fish || 0);
        yarnDisplay.textContent = formatNumber(state.meta?.yarn || 0);

        // Стало:
        const clickCost = getClickUpgradeCost(state.run.clickLevel);
        const clickPower = getClickPower(state);
        
        btnUpgradeClick.querySelector('.btn-title').innerHTML = `${getSvgIcon('cookie', 16)} Клик ур. <span id="click-level-val">${state.run.clickLevel}</span> (+${formatNumber(clickPower)})`;
        btnUpgradeClick.querySelector('.btn-cost').innerHTML = `${getSvgIcon('cookie', 15)} <span id="click-cost-display">${formatNumber(clickCost)}</span>`;

        if (state.run.cookies >= clickCost) {
          btnUpgradeClick.classList.add('can-afford');
        } else {
          btnUpgradeClick.classList.remove('can-afford');
        }

        updateSoundUI();

        if (activeTabId === 'generators') {
          renderGeneratorsList();
        } else if (activeTabId === 'prestige') {
          renderPrestigeView();
        } else if (activeTabId === 'shop') {
          renderShopView();
        } else if (activeTabId === 'wardrobe') {
          renderWardrobeView();
        }
      }

      window.addEventListener('beforeunload', () => saveToLocal(state));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveToLocal(state);
      });

      updateCatVisuals(state);
      renderStaticUI();
      let lastTimestamp = performance.now();
      let saveAccumulator = 0;

      function tick(currentTimestamp) {
        let dt = (currentTimestamp - lastTimestamp) / 1000;
        lastTimestamp = currentTimestamp;

        if (dt > 1.0) dt = 1.0;
        if (dt < 0 || Number.isNaN(dt)) dt = 0;

        const maxFeverDur = getMaxFeverDuration(state);

        if (state.boosts.feverActive) {
          feverRemainingTimer -= dt;
          if (feverRemainingTimer <= 0) {
            state.boosts.feverActive = false;
            state.boosts.feverProgress = 0;
            feverRemainingTimer = 0;
          } else {
            state.boosts.feverProgress = Math.max(0, (feverRemainingTimer / maxFeverDur) * 100);
          }
        } else if (state.boosts.feverProgress > 0) {
          state.boosts.feverProgress = Math.max(0, state.boosts.feverProgress - 2.5 * dt);
        }

        const currentRate = calculateTotalRate(state);
        if (currentRate > 0 && dt > 0) {
          subCookieAccumulator += currentRate * dt;
          const intEarned = Math.floor(subCookieAccumulator);
          if (intEarned > 0) {
            state.run.cookies += intEarned;
            state.run.lifetimeCookiesRun += intEarned;
            state.stats.totalCookiesAllTime += intEarned;
            subCookieAccumulator -= intEarned;
          }
        }

        const nowMs = Date.now();
        if (nowMs >= nextFishSpawnTimestamp) {
          spawnFlyingFish();
          nextFishSpawnTimestamp = nowMs + 1000 * getNextFishIntervalSec();
        }

        if (nowMs >= nextBoxSpawnTimestamp) {
          spawnSurpriseBox();
        }

        saveAccumulator += dt;
        if (saveAccumulator >= 3.0) {
          saveAccumulator = 0;
          saveToLocal(state);
        }

        cookiesDisplay.textContent = formatNumber(state.run.cookies);
        rateDisplay.textContent = formatNumber(calculateTotalRate(state));

        const progress = Math.max(0, Math.min(100, state.boosts.feverProgress || 0));
        const offset = FEVER_CIRCUMFERENCE - (progress / 100) * FEVER_CIRCUMFERENCE;
        feverRingProgress.style.strokeDashoffset = String(offset);

        if (state.boosts.feverActive) {
          feverWrapper.classList.add('fever-active');
        } else {
          feverWrapper.classList.remove('fever-active');
        }

        const expiry = state.boosts.adMultiplierExpiresAt || 0;
        if (expiry > nowMs) {
          btnAdBoost.classList.remove('inactive');
          adBoostTimer.textContent = formatTime(Math.floor((expiry - nowMs) / 1000), 'timer');
        } else {
          btnAdBoost.classList.add('inactive');
          adBoostTimer.textContent = 'Активировать';
        }

        if (activeTabId === 'prestige') {
          const allTime = state.stats.totalCookiesAllTime || 0;
          const { prev, next } = getPrestigeThresholds(allTime, state);
          const progressPct = Math.min(100, Math.max(0, Math.floor(((allTime - prev) / (next - prev)) * 100)));
          const neededToNext = Math.max(0, next - allTime);

          const barFill = document.getElementById('prestige-bar-fill');
          const progText = document.getElementById('prestige-progress-text');
          const progPct = document.getElementById('prestige-progress-pct');
          const doPrestigeBtn = document.getElementById('btn-do-prestige');
          const doPrestigeText = document.getElementById('btn-do-prestige-text');

          if (barFill) barFill.style.width = `${progressPct}%`;
          if (progText) progText.textContent = `След. звезда: ${formatNumber(allTime)} / ${formatNumber(next)} (${progressPct}%)`;
          if (progPct) progPct.textContent = `${progressPct}%`;

          const rewardStars = calculatePrestigeReward(state);
          const canPrestige = rewardStars > 0;
          if (doPrestigeBtn) doPrestigeBtn.disabled = !canPrestige;
          if (doPrestigeText) {
            doPrestigeText.innerHTML = canPrestige 
              ? `${getSvgIcon('star', 15)} Переехать и получить +${rewardStars} Звёзд` 
              : `До следующей Звезды: ${formatNumber(neededToNext)} ${getSvgIcon('cookie', 14)}`;
          }
        }

        if (activeTabId === 'generators') {
          const cards = tabPanes.generators.querySelectorAll('.generator-card');
          cards.forEach((card) => {
            const btn = card.querySelector('.gen-buy-btn');
            if (!btn) return;
            const genId = btn.dataset.genId;
            if (!genId) return;

            let count = 1;
            let cost = 0;
            let canAfford = false;

            if (currentBatchMode === '10') {
              count = 10;
              cost = getBatchCost(genId, 10, state);
              canAfford = state.run.cookies >= cost && cost > 0;
            } else if (currentBatchMode === 'max') {
              const maxInfo = getMaxAffordable(genId, state);
              if (maxInfo.count > 0) {
                count = maxInfo.count;
                cost = maxInfo.cost;
                canAfford = state.run.cookies >= cost;
              } else {
                count = 1;
                cost = maxInfo.cost;
                canAfford = false;
              }
            } else {
              cost = getSingleGeneratorCost(genId, state);
              count = 1;
              canAfford = state.run.cookies >= cost && cost > 0;
            }

            btn.disabled = !canAfford;

            const countSpan = btn.querySelector('.btn-buy-count');
            const costSpan = btn.querySelector('.btn-buy-cost');

            if (countSpan) countSpan.textContent = `+${count}`;
            if (costSpan) costSpan.innerHTML = `${getSvgIcon('cookie', 14)} ${formatNumber(cost)}`;

            if (canAfford) {
              card.classList.add('can-afford');
            } else {
              card.classList.remove('can-afford');
            }
          });
        }

        const clickCost = getClickUpgradeCost(state.run.clickLevel);
        if (state.run.cookies >= clickCost) {
          btnUpgradeClick.classList.add('can-afford');
        } else {
          btnUpgradeClick.classList.remove('can-afford');
        }

        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
